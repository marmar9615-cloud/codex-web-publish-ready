<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090f" />
    <meta name="description" content="Codex Web — the browser frontend for the Codex coding agent." />
    <title>Codex Web</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <div class="brand" aria-label="Codex Web">
            <span class="brand-mark" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.5 3.5 5.5 10.5 2.5 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>codex<span class="brand-accent">/web</span></span>
          </div>
          <button id="new-thread" type="button" class="icon-btn ghost" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <div class="sidebar-filters" role="tablist" aria-label="Thread filters">
          <button id="thread-filter-active" type="button" class="filter-pill active" role="tab" aria-selected="true">Active</button>
          <button id="thread-filter-archived" type="button" class="filter-pill" role="tab" aria-selected="false">Archived</button>
        </div>
        <section class="sidebar-section" aria-labelledby="projects-heading">
          <div class="sidebar-section-head">
            <h2 id="projects-heading">Projects</h2>
            <button id="new-project-btn" type="button" class="icon-btn ghost" title="New project" aria-label="New project">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div id="projects" aria-label="Projects"></div>
        </section>
        <nav id="threads" aria-label="Conversations"></nav>
        <footer>
          <div id="account-info">
            <span id="account-status" class="muted">checking…</span>
            <button id="account-btn" type="button">Sign in</button>
          </div>
          <button id="settings-btn" type="button" class="full ghost">Settings</button>
        </footer>
      </aside>

      <main id="chat">
        <div id="chat-header">
          <div class="chat-header-main">
            <div id="thread-title">New conversation</div>
            <div id="workspace-root-chip" class="header-subtitle" hidden></div>
          </div>
          <div id="status-bar" aria-label="Session status">
            <button id="workspace-toggle-btn" type="button" class="pill ghost-pill">Files</button>
            <span id="backend-pill" class="pill">backend: …</span>
            <span id="account-pill" class="pill" hidden>account: …</span>
            <span id="model-pill" class="pill">model: …</span>
            <span id="approval-pill" class="pill">approvals: …</span>
            <span id="sandbox-pill" class="pill">sandbox: …</span>
            <span id="token-pill" class="pill" hidden>tokens: …</span>
            <span id="rate-pill" class="pill" hidden>rate: …</span>
          </div>
        </div>

        <div id="transcript" tabindex="0" aria-label="Conversation"></div>
        <template id="empty-hero-tpl">
          <div class="empty-hero" aria-hidden="false">
            <div class="empty-hero-mark" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.5 7 11 19 5.5 13.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1 class="empty-hero-title">How can I help today?</h1>
            <p class="empty-hero-sub">I can read your code, run commands, apply patches, and browse the web. Try one of these to get started.</p>
            <div class="empty-hero-chips">
              <button type="button" class="hero-chip" data-prompt="Give me a plan to add a dark mode toggle.">
                <span class="hero-chip-tag">plan</span>
                Plan a feature
              </button>
              <button type="button" class="hero-chip" data-prompt="Explain what this project does and show me its architecture.">
                <span class="hero-chip-tag">explain</span>
                Explain this repo
              </button>
              <button type="button" class="hero-chip" data-prompt="Write tests for the most complex function you can find.">
                <span class="hero-chip-tag">test</span>
                Write tests
              </button>
              <button type="button" class="hero-chip" data-prompt="Find and fix any obvious bugs in recently-changed files.">
                <span class="hero-chip-tag">fix</span>
                Find bugs
              </button>
            </div>
          </div>
        </template>

        <form id="composer" autocomplete="off">
          <div id="autocomplete" hidden></div>
          <div class="composer-shell">
            <div id="pending-uploads" hidden></div>
            <textarea id="input"
              rows="1"
              aria-label="Message Codex"
              placeholder="Ask Codex anything. Use / for commands, @ to reference files…"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              data-gramm="false"
              data-gramm_editor="false"
              data-enable-grammarly="false"></textarea>
            <div class="composer-row">
              <span id="composer-hint" class="muted">
                <kbd>↵</kbd> send<span class="sep">·</span>
                <kbd>⇧↵</kbd> newline<span class="sep">·</span>
                <kbd>/</kbd> commands<span class="sep">·</span>
                <kbd>esc</kbd> cancel
              </span>
              <div>
                <input id="attach-input" type="file" accept="image/*" hidden />
                <button type="button" id="attach-btn" class="ghost" title="Attach image">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="vertical-align:-2px;margin-right:4px">
                    <path d="M11.5 7 7 11.5a2.5 2.5 0 0 1-3.5-3.5l5-5a1.8 1.8 0 1 1 2.5 2.5L5.7 10.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>Attach
                </button>
                <button type="button" id="cancel-btn" class="danger" hidden>
                  <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="vertical-align:-1px;margin-right:4px">
                    <rect x="1.5" y="1.5" width="7" height="7" rx="1" fill="currentColor"/>
                  </svg>Stop
                </button>
                <button type="submit" id="send-btn" class="primary">
                  Send
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="vertical-align:-1px;margin-left:4px">
                    <path d="m3 8 10-4-4 10-2-4-4-2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </form>
      </main>

      <aside id="workspace-panel" aria-label="Workspace files">
        <header class="workspace-header">
          <div>
            <div class="workspace-eyebrow">Workspace</div>
            <div class="workspace-title-row">
              <strong>Files</strong>
              <span id="workspace-status" class="muted">disconnected</span>
            </div>
            <div id="workspace-root-path" class="workspace-root-path">No active workspace</div>
          </div>
          <div class="workspace-actions">
            <button id="workspace-refresh-btn" type="button" class="ghost">Refresh</button>
            <button id="workspace-run-tests-btn" type="button" class="ghost">Run tests</button>
            <button id="workspace-close-btn" type="button" class="ghost">Hide</button>
          </div>
        </header>
        <div id="workspace-shell">
          <div id="workspace-files" aria-label="Workspace file tree"></div>
          <div id="workspace-viewer" aria-label="Workspace file viewer">
            <div class="workspace-empty">
              Select a file from the workspace tree to preview it here.
            </div>
          </div>
        </div>
        <section id="workspace-runner" aria-label="Workspace test runner"></section>
      </aside>
    </div>

    <!-- Modals -->
    <div id="modal-root"></div>

    <script>
      // Keep a rich empty-state hero in #transcript whenever it's empty.
      const transcript = document.getElementById("transcript");
      const heroTpl = document.getElementById("empty-hero-tpl");
      const mountHero = () => {
        if (!transcript || !heroTpl) return;
        if (transcript.querySelector(".empty-hero")) return;
        if (transcript.children.length > 0) return;
        transcript.appendChild(heroTpl.content.cloneNode(true));
      };
      mountHero();
      new MutationObserver(() => {
        if (transcript.children.length === 0) mountHero();
      }).observe(transcript, { childList: true });

      // Hero chip click → fill composer with prompt
      document.addEventListener("click", (event) => {
        const chip = event.target.closest(".hero-chip[data-prompt]");
        if (!chip) return;
        const input = document.getElementById("input");
        if (!input) return;
        input.value = chip.dataset.prompt || "";
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.focus();
      });
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
